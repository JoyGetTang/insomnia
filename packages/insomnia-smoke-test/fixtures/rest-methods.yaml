      - url: "{{ _.base_url }}/get"
        name: HEAD
        meta:
          id: req_0de666b33a17412eb8baa47f857658dd
          created: 1773626632229
          modified: 1773629398101
          isPrivate: false
          description: ""
          sortKey: -1773626626971
        method: HEAD
        scripts:
          afterResponse: >-
            insomnia.test("Status is 200 or 204", () => {
                const statusCode = insomnia.response.code;
                insomnia.expect(statusCode).to.be.oneOf([200, 204]);
            });


            insomnia.test("Response has no body", () => {
                const body = insomnia.response.text();
                insomnia.expect(body).to.equal(""); // HEAD must return empty body
            });


            insomnia.test("Response time < 1000ms", () => {
                insomnia.expect(insomnia.response.responseTime).to.be.below(1000);
            });
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/get"
        name: OPTIONS
        meta:
          id: req_47b8b752c4514dfd96e036d90d9f8660
          created: 1773626632229
          modified: 1773629463552
          isPrivate: false
          description: ""
          sortKey: -1773626626970
        method: OPTIONS
        scripts:
          afterResponse: >-
            insomnia.test("Status is 200 or 204", () => {
                insomnia.expect(insomnia.response.code).to.be.oneOf([200, 204]);
            });


            insomnia.test("Has 'Allow' header with GET, HEAD, OPTIONS", () => {
                const allow = insomnia.response.headers.get('Allow');
                insomnia.expect(allow).to.include('GET');
                insomnia.expect(allow).to.include('HEAD');
                insomnia.expect(allow).to.include('OPTIONS');
            });


            insomnia.test("CORS headers present (if needed)", () => {
                const corsHeaders = ['Access-Control-Allow-Origin', 'Access-Control-Allow-Methods'];
                corsHeaders.forEach(header => {
                    insomnia.expect(insomnia.response.headers.has(header)).to.be.true;
                });
            });
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
